# Single-binary Tempo for the local compose stack (not production sizing).
# Accepts OTLP (gRPC + HTTP), stores traces locally, and runs the metrics-generator
# so Grafana can render a live service graph (nodes = services, edges = calls with
# request rate / latency / error rate) from the span data.
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

# metrics-generator derives service-graph + span metrics from spans and remote-writes
# them to Prometheus, where Grafana's Tempo datasource reads them for the graph view.
metrics_generator:
  registry:
    external_labels:
      source: tempo
  storage:
    path: /var/tempo/generator/wal
    remote_write:
      - url: http://prometheus:9090/api/v1/write
        send_exemplars: true
  processor:
    service_graphs:
      # Explicit values: an empty block zeroes max_items/wait and drops all spans.
      max_items: 10000
      wait: 10s
    span_metrics:
      histogram_buckets: [0.1, 0.2, 0.4, 0.8, 1.6, 3.2, 6.4, 12.8]

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

# Enable the generator processors for the (single) default tenant.
overrides:
  defaults:
    metrics_generator:
      processors:
        - service-graphs
        - span-metrics
