global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: indexer
    static_configs:
      - targets: ["indexer:9101"]
  - job_name: query
    static_configs:
      - targets: ["query:9102"]
  - job_name: normalizer
    static_configs:
      - targets: ["normalizer:9100"]
  - job_name: mlservice
    metrics_path: /metrics
    static_configs:
      - targets: ["mlservice:8000"]
  - job_name: redpanda
    metrics_path: /public_metrics
    static_configs:
      - targets: ["redpanda:9644"]
