model_list:
  - model_name: gemini-flash
    litellm_params: { model: gemini/gemini-3.8-flash, api_key: os.environ/GEMINI_API_KEY }
  - model_name: claude-haiku
    litellm_params: { model: anthropic/claude-haiku-4-5, api_key: os.environ/ANTHROPIC_API_KEY }
  - model_name: local
    litellm_params: { model: ollama_chat/llama3.2:3b, api_base: http://ollama:11434 }
litellm_settings: { drop_params: true }
general_settings: { master_key: os.environ/LITELLM_MASTER_KEY }
