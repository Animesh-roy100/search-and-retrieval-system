server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets with a long cache; index.html stays uncached for deploys.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Reverse-proxy API calls to the Go query service. The browser only ever talks to
  # this origin, so there is no CORS to configure. /api/search -> query:8080/search.
  #
  # Resolve "query" through Docker's embedded DNS at request time (variable upstream).
  # A static proxy_pass host is resolved once at startup, so recreating the query
  # container (new IP) would leave nginx returning 502 until it restarts.
  location /api/ {
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $query_upstream http://query:8080;
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass $query_upstream;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  # SPA fallback: every unknown path serves index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
