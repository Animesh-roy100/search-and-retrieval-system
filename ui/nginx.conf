server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Static assets with a long cache; index.html stays uncached for deploys.
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # Reverse-proxy API calls to the Go query service. The browser only ever talks to
  # this origin, so there is no CORS to configure. The /api prefix is stripped so
  # /api/search -> query:8080/search.
  location /api/ {
    proxy_pass http://query:8080/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 300s;
  }

  # SPA fallback: every unknown path serves index.html so client-side routing works.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
