name: retrieval

services:
  # --- source ---
  postgres:
    image: postgres:16
    command: ["postgres", "-c", "wal_level=logical", "-c", "max_wal_senders=4", "-c", "max_replication_slots=4"]
    environment:
      POSTGRES_USER: retrieval
      POSTGRES_PASSWORD: retrieval
      POSTGRES_DB: retrieval
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports: ["5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retrieval"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- broker ---
  redpanda:
    image: redpandadata/redpanda:v24.2.7
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=1G
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=PLAINTEXT://0.0.0.0:29092,OUTSIDE://0.0.0.0:9092
      - --advertise-kafka-addr=PLAINTEXT://redpanda:29092,OUTSIDE://localhost:9092
    ports: ["9092:9092", "9644:9644"]
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30

  # --- CDC ---
  connect:
    image: debezium/connect:2.7.3.Final
    depends_on:
      postgres: { condition: service_healthy }
      redpanda: { condition: service_healthy }
    environment:
      BOOTSTRAP_SERVERS: redpanda:29092
      GROUP_ID: connect-cluster
      CONFIG_STORAGE_TOPIC: connect_configs
      OFFSET_STORAGE_TOPIC: connect_offsets
      STATUS_STORAGE_TOPIC: connect_statuses
      KEY_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      VALUE_CONVERTER: org.apache.kafka.connect.json.JsonConverter
      CONNECT_KEY_CONVERTER_SCHEMAS_ENABLE: "false"
      CONNECT_VALUE_CONVERTER_SCHEMAS_ENABLE: "false"
    ports: ["8083:8083"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8083/connectors || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30

  # --- search stores ---
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      discovery.type: single-node
      bootstrap.memory_lock: "true"
      DISABLE_SECURITY_PLUGIN: "true"
      DISABLE_INSTALL_DEMO_CONFIG: "true"
      OPENSEARCH_JAVA_OPTS: "-Xms512m -Xmx512m"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    ports: ["9200:9200"]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 40

  qdrant:
    image: qdrant/qdrant:v1.19.1
    ports: ["6333:6333", "6334:6334"]
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # --- app services ---
  mlservice:
    build:
      context: ./mlservice
    environment:
      EMBED_BACKEND: hash
      RERANK_BACKEND: lexical
    ports: ["8000:8000"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health').status==200 else 1)\""]
      interval: 5s
      timeout: 3s
      retries: 30

  normalizer:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { SERVICE: normalizer }
    depends_on:
      redpanda: { condition: service_healthy }
    environment:
      REDPANDA_BROKERS: redpanda:29092
      CDC_TOPIC: cdc.public.documents
      METRICS_ADDR: ":9100"
    ports: ["9100:9100"]

  indexer:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { SERVICE: indexer }
    depends_on:
      redpanda: { condition: service_healthy }
      opensearch: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      mlservice: { condition: service_healthy }
    environment:
      REDPANDA_BROKERS: redpanda:29092
      OPENSEARCH_URL: http://opensearch:9200
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      ML_SERVICE_ADDR: http://mlservice:8000
      METRICS_ADDR: ":9101"
    # No fixed host port so `make scale-indexer N=4` can run multiple replicas.
    # Prometheus scrapes indexer:9101 over the compose network; consumer-group lag
    # (Redpanda) is the authoritative aggregate throughput signal under load.
    expose: ["9101"]

  query:
    build:
      context: .
      dockerfile: deploy/go.Dockerfile
      args: { SERVICE: query }
    depends_on:
      opensearch: { condition: service_healthy }
      qdrant: { condition: service_healthy }
      mlservice: { condition: service_healthy }
      redis: { condition: service_healthy }
    environment:
      OPENSEARCH_URL: http://opensearch:9200
      QDRANT_HOST: qdrant
      QDRANT_PORT: "6334"
      ML_SERVICE_ADDR: http://mlservice:8000
      REDIS_ADDR: redis:6379
      QUERY_ADDR: ":8080"
      METRICS_ADDR: ":9102"
      LLM_PROVIDER: ${LLM_PROVIDER:-extractive}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports: ["8080:8080", "9102:9102"]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 30

  # --- observability ---
  prometheus:
    image: prom/prometheus:v2.55.1
    volumes:
      - ./deploy/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports: ["9090:9090"]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./deploy/grafana/provisioning:/etc/grafana/provisioning:ro
    ports: ["3000:3000"]
    depends_on: [prometheus]
